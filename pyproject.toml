[project]
name = "aanalyticsext"
version = "0.1.0"
description = "Adobe Analytics 2.0 API bulk extraction engine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["adobe-analytics", "analytics", "etl", "extraction"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Database",
]
dependencies = [
    # SQLAlchemy 1.4 / 2.0 두 레인 모두 테스트 통과.
    # 단 pandas 2.2+ 는 SQLAlchemy 2.0+ 를 요구한다 — 이 조합은 메타데이터로
    # 표현할 수 없어서 런타임에서 검사한다(actModuler._checkDbStack).
    # 상한을 두지 않으면 pip가 둘 다 최신(2.0 + 2.3)으로 잡아 정상 조합이 된다.
    "sqlalchemy>=1.4.36",
    "pandas>=2.0",
    "aanalytics2",
]

[project.optional-dependencies]
mysql = ["pymysql"]

[project.urls]
Homepage = "https://github.com/Glory-Cho/aanalyticsext"
Repository = "https://github.com/Glory-Cho/aanalyticsext"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.build]
includes = ["aanalyticsext"]
